[build]
  command = "yarn build"

[functions]
  node_bundler = "esbuild"

[context.production.environment]
  NEXT_PUBLIC_CONVEX_URL = "https://grateful-oyster-780.convex.cloud"

# Safe{Wallet} reads /manifest.json cross-origin from app.safe.global to
# validate BTB as a Safe App. Next's headers() config does not reach files
# served straight from public/ on Netlify, so the CORS header lives here.
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET"
    Access-Control-Allow-Headers = "X-Requested-With, content-type, Authorization"
