name: Rust API image

# Builds the Rust API (api-rs/) and publishes it to GitHub Container Registry:
#   ghcr.io/btb-finance/btb-api:latest        from main
#   ghcr.io/btb-finance/btb-api:<branch>      from other branches that touch api-rs
#   ghcr.io/btb-finance/btb-api:sha-<commit>  every build, for pinning a deploy
on:
  push:
    branches: ["**"]
    paths:
      - "api-rs/**"
      - ".github/workflows/api-rs-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/btb-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: api-rs
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
