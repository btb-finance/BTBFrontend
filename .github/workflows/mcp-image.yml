name: MCP server image

# Builds the standalone MCP server (mcp-server/) and publishes it to GitHub Container Registry:
#   ghcr.io/btb-finance/btb-mcp:latest        from main
#   ghcr.io/btb-finance/btb-mcp:<branch>      from other branches that touch the MCP
#   ghcr.io/btb-finance/btb-mcp:sha-<commit>  every build, for pinning a deploy
on:
  push:
    branches: ["**"]
    paths:
      - "mcp-server/**"
      - "src/lib/**"
      - "convex/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/mcp-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/btb-mcp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
